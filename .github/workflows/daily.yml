name: 每日复盘推送 (威科夫+缠论)

on:
  schedule:
    # GitHub Actions 定时使用 UTC, 北京时间 = UTC + 8
    # 为避开整点拥堵, 分钟错开到 :07 / :37
    - cron: '07 1 * * 1-5'    # 北京时间 09:07 盘前 (周一至周五)
    - cron: '37 7 * * 1-5'    # 北京时间 15:37 盘后
    - cron: '07 15 * * 1-5'   # 北京时间 23:07 晚间 (美股开盘后)
  workflow_dispatch:          # 允许在 Actions 页面手动触发测试
    inputs:
      session:
        description: '要运行的时段'
        required: true
        default: 'premarket'
        type: choice
        options: [premarket, postmarket, evening, all]

permissions:
  contents: write             # 需要写权限把图表推到仓库当图床

concurrency:
  group: daily-review
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -fv >/dev/null 2>&1 || true

      - name: 配置 Git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 判定时段
        id: sess
        run: |
          MANUAL="${{ github.event.inputs.session }}"
          SCHED="${{ github.event.schedule }}"
          if [ -n "$MANUAL" ]; then
            echo "value=$MANUAL" >> $GITHUB_OUTPUT
            echo "来源: 手动触发, 时段=$MANUAL"
          else
            # 用触发本任务的 cron 表达式判断, 不依赖运行时钟
            # (GitHub 定时可能延迟几十分钟, 用时钟会判错时段)
            case "$SCHED" in
              '07 1 * * 1-5')   echo "value=premarket"  >> $GITHUB_OUTPUT ;;
              '37 7 * * 1-5')   echo "value=postmarket" >> $GITHUB_OUTPUT ;;
              '07 15 * * 1-5')  echo "value=evening"    >> $GITHUB_OUTPUT ;;
              *)  # 兜底: 按 UTC 小时推断 (仅当上面都没匹配到)
                  H=$(date -u +%H)
                  if [ "$H" = "07" ] || [ "$H" = "08" ]; then echo "value=postmarket" >> $GITHUB_OUTPUT
                  elif [ "$H" = "15" ] || [ "$H" = "16" ]; then echo "value=evening" >> $GITHUB_OUTPUT
                  else echo "value=premarket" >> $GITHUB_OUTPUT
                  fi ;;
            esac
            echo "来源: 定时触发 cron=$SCHED, 时段=$(cat $GITHUB_OUTPUT | cut -d= -f2)"
          fi

      - name: 运行复盘并推送微信
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py ${{ steps.sess.outputs.value }}

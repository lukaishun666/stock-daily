name: 每日复盘推送 (威科夫+缠论)

on:
  schedule:
    # GitHub Actions 定时使用 UTC, 北京时间 = UTC + 8
    # 为避开整点拥堵, 分钟错开到 :07 / :37
    - cron: '07 1 * * 1-5'    # 北京时间 09:07 盘前 (周一至周五)
    - cron: '37 7 * * 1-5'    # 北京时间 15:37 盘后
    - cron: '07 15 * * 1-5'   # 北京时间 23:07 晚间 (美股开盘后)
  workflow_dispatch:          # 允许在 Actions 页面手动触发测试
    inputs:
      session:
        description: '要运行的时段'
        required: true
        default: 'premarket'
        type: choice
        options: [premarket, postmarket, evening, all]

permissions:
  contents: write             # 需要写权限把图表推到仓库当图床

concurrency:
  group: daily-review
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 安装中文字体
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk
          fc-cache -fv >/dev/null 2>&1 || true

      - name: 配置 Git 身份
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 判定时段
        id: sess
        run: |
          if [ -n "${{ github.event.inputs.session }}" ]; then
            echo "value=${{ github.event.inputs.session }}" >> $GITHUB_OUTPUT
          else
            H=$(date -u +%H)
            M=$(date -u +%M)
            # UTC 01:xx -> premarket, 07:xx -> postmarket, 15:xx -> evening
            if [ "$H" = "01" ]; then echo "value=premarket" >> $GITHUB_OUTPUT
            elif [ "$H" = "07" ]; then echo "value=postmarket" >> $GITHUB_OUTPUT
            elif [ "$H" = "15" ]; then echo "value=evening" >> $GITHUB_OUTPUT
            else echo "value=premarket" >> $GITHUB_OUTPUT
            fi
          fi

      - name: 运行复盘并推送微信
        env:
          SERVERCHAN_SENDKEY: ${{ secrets.SERVERCHAN_SENDKEY }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python main.py ${{ steps.sess.outputs.value }}
